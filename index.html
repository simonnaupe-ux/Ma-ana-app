<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172e48"><meta name="description" content="MAÑANA: organiza tus pendientes y gastos sin complicaciones"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>MAÑANA · Tu día y tu dinero</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#21324a;background:#eef3fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #91baff}header{background:#172e48;color:#fff;padding:19px max(16px,calc((100vw - 950px)/2));display:flex;align-items:center;justify-content:space-between}header strong{font-size:26px;letter-spacing:-1.5px}header small{display:block;color:#bcd2e9;font-size:11px}.wrap{max-width:950px;margin:auto;padding:18px 14px 90px}.tabs{display:flex;gap:7px;overflow-x:auto;padding:8px 0 15px}.tabs button{border:0;background:#dfe8f4;color:#344d69;border-radius:14px;padding:11px 15px;white-space:nowrap}.tabs button.active{background:#234f83;color:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:white;border-radius:18px;padding:17px;box-shadow:0 4px 20px #1b3e6510;margin-bottom:12px}.card h2{font-size:17px;margin:0 0 12px}.muted{color:#66788d;font-size:13px}.money{font-size:27px;font-weight:750;letter-spacing:-.8px}.green{color:#13835b}.red{color:#b2474b}.primary{background:#245b9d;color:white;border:0;border-radius:11px;padding:11px 15px}.secondary{background:#e9f0fa;color:#234f83;border:0;border-radius:11px;padding:10px 13px}.danger{color:#b2474b;background:#fff0f0;border:0;border-radius:10px;padding:8px 10px}.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:130px}.field label{font-size:12px;color:#52677d}input,select,textarea{border:1px solid #cdd9e8;border-radius:11px;padding:11px;background:#fff;color:#24384f;min-width:0;width:100%}.formrow{display:flex;gap:9px;flex-wrap:wrap;align-items:end}.formrow button{min-height:43px}.entry{display:flex;align-items:center;gap:10px;border-top:1px solid #eef1f6;padding:12px 0}.entry:first-of-type{border-top:0}.entry .detail{flex:1;min-width:0}.entry strong{display:block;overflow-wrap:anywhere}.entry small{color:#758498}.entry input[type=checkbox]{width:19px;height:19px;flex:none}.pill{font-size:11px;border-radius:20px;background:#e8eef9;padding:5px 8px;color:#40638b}.bar{height:9px;background:#e8edf5;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:#2b8d76;transition:width .2s}.empty{color:#718297;text-align:center;padding:22px 6px}.chartrow{display:grid;grid-template-columns:95px 1fr 75px;align-items:center;gap:9px;margin:10px 0;font-size:12px}.chartrow .bar>div{background:#547ec5}.notice{padding:12px;border-radius:12px;background:#eef5ff;color:#345a86;font-size:13px}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center}.small{font-size:12px}.hidden{display:none!important}.footer{text-align:center;color:#77879a;font-size:11px;padding:15px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:550px){.grid,.two{grid-template-columns:1fr}.money{font-size:24px}.wrap{padding:12px 10px 85px}.card{padding:14px}.chartrow{grid-template-columns:76px 1fr 65px}}@media(min-width:750px){.dashboard{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dashboard>.card{margin:0}}
</style></head><body><header><div><strong>mañana<span style="color:#91c8ff">.</span></strong><small>Tu día y tu dinero, organizados</small></div><span id="todayHeader" class="small"></span></header><main class="wrap"><nav class="tabs" aria-label="Secciones"><button data-tab="inicio" class="active">☀️ Inicio</button><button data-tab="tareas">✓ Pendientes</button><button data-tab="gastos">💳 Gastos</button><button data-tab="informes">📊 Informes</button><button data-tab="ajustes">⚙️ Ajustes</button></nav><div id="screen" aria-live="polite"></div><div class="footer">MAÑANA · Versión 1.0 · Datos guardados en este dispositivo</div></main><script>
'use strict';const KEY='manana_v1_data';const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const tomorrow=()=>{let d=new Date();d.setDate(d.getDate()+1);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const money=n=>new Intl.NumberFormat('es-PE',{style:'currency',currency:state.settings.currency||'PEN'}).format(n||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const base=()=>({tasks:[],expenses:[],settings:{morning:'07:00',night:'21:00',budget:0,currency:'PEN',notifications:false},notified:{}});let state=base(),tab='inicio';try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.tasks)&&Array.isArray(x.expenses)&&x.settings)state={...base(),...x,settings:{...base().settings,...x.settings}}}catch(e){}const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('No se pudo guardar. Exporta una copia y comprueba el almacenamiento del navegador.')}};const formatDate=d=>new Date(d+'T12:00:00').toLocaleDateString('es-PE',{day:'numeric',month:'short',year:'numeric'});const total=(items)=>items.reduce((a,x)=>a+Number(x.amount||0),0);const dayExpenses=d=>state.expenses.filter(x=>x.date===d);const monthExpenses=m=>state.expenses.filter(x=>x.date.startsWith(m));const month=()=>today().slice(0,7);const pending=d=>state.tasks.filter(x=>x.date===d&&!x.done);const taskRows=(arr)=>arr.length?arr.map(x=>`<div class="entry"><input aria-label="Completar ${esc(x.title)}" type="checkbox" data-check="${esc(x.id)}" ${x.done?'checked':''}><div class="detail"><strong style="${x.done?'text-decoration:line-through;color:#8391a1':''}">${esc(x.title)}</strong><small>${formatDate(x.date)}${x.time?' · '+esc(x.time):''}</small></div><button class="danger" data-delete-task="${esc(x.id)}" aria-label="Eliminar tarea">×</button></div>`).join(''):'<div class="empty">No tienes pendientes aquí. ¡Disfruta tu tiempo!</div>';const expenseRows=arr=>arr.length?arr.sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="entry"><div class="detail"><strong>${esc(x.title)}</strong><small>${esc(x.category)} · ${formatDate(x.date)} · ${x.planned?'Previsto':'Real'}</small></div><b>${money(x.amount)}</b><button class="danger" data-delete-expense="${esc(x.id)}" aria-label="Eliminar gasto">×</button></div>`).join(''):'<div class="empty">Todavía no hay gastos registrados.</div>';const expenseForm=(date=today(),planned=false)=>`<form id="expenseForm" class="formrow"><div class="field"><label>Concepto</label><input name="title" maxlength="90" placeholder="Ej. almuerzo" required></div><div class="field" style="max-width:130px"><label>Monto</label><input name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required></div><div class="field" style="max-width:155px"><label>Categoría</label><select name="category"><option>Alimentación</option><option>Transporte</option><option>Servicios</option><option>Compras</option><option>Salud</option><option>Estudios</option><option>Otros</option></select></div><div class="field" style="max-width:160px"><label>Fecha</label><input name="date" type="date" value="${date}" required></div><div class="field" style="max-width:150px"><label>Tipo</label><select name="planned"><option value="false" ${!planned?'selected':''}>Gasto real</option><option value="true" ${planned?'selected':''}>Gasto previsto</option></select></div><button class="primary">+ Guardar gasto</button></form>`;const taskForm=(date=tomorrow())=>`<form id="taskForm" class="formrow"><div class="field"><label>¿Qué necesitas hacer?</label><input name="title" maxlength="140" placeholder="Ej. pagar el recibo" required></div><div class="field" style="max-width:160px"><label>Fecha</label><input type="date" name="date" value="${date}" required></div><div class="field" style="max-width:125px"><label>Hora (opcional)</label><input type="time" name="time"></div><button class="primary">+ Agregar</button></form>`;function render(){document.getElementById('todayHeader').textContent=new Date().toLocaleDateString('es-PE',{weekday:'short',day:'numeric',month:'short'});document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const el=document.getElementById('screen');const todayReal=dayExpenses(today()).filter(x=>!x.planned),monthReal=monthExpenses(month()).filter(x=>!x.planned),tomPlan=dayExpenses(tomorrow()).filter(x=>x.planned);if(tab==='inicio'){let b=Number(state.settings.budget)||0;el.innerHTML=`<div class="card" style="background:linear-gradient(120deg,#203f68,#336aa0);color:white"><div class="muted" style="color:#d4e6fa">Tu resumen de hoy · ${formatDate(today())}</div><h1 style="margin:8px 0">Organiza tu día, sin olvidos.</h1><div>Esta noche prepara mañana; por la mañana revisa tu plan.</div></div><div class="grid"><div class="card"><div class="muted">Gastado hoy</div><div class="money">${money(total(todayReal))}</div></div><div class="card"><div class="muted">Gastado este mes</div><div class="money">${money(total(monthReal))}</div>${b?`<div class="muted">Presupuesto restante: <b class="${b-total(monthReal)>=0?'green':'red'}">${money(b-total(monthReal))}</b></div><div class="bar"><div style="width:${Math.min(100,total(monthReal)/b*100)}%"></div></div>`:'<div class="muted">Configura un presupuesto en Ajustes</div>'}</div></div><div class="dashboard"><div class="card"><div class="topline"><h2>☀️ Pendientes de hoy</h2><span class="pill">${pending(today()).length} pendientes</span></div>${taskRows(state.tasks.filter(x=>x.date===today()))}<button class="secondary" data-go="tareas">Ver todos los pendientes</button></div><div class="card"><div class="topline"><h2>🌙 Prepara mañana</h2><span class="pill">${formatDate(tomorrow())}</span></div><div class="muted">Pendientes para mañana: ${pending(tomorrow()).length} · Gastos previstos: ${money(total(tomPlan))}</div><div style="margin-top:12px">${taskForm(tomorrow())}</div></div></div><div class="card"><h2>💳 Registrar un gasto</h2>${expenseForm()}</div>`}else if(tab==='tareas'){el.innerHTML=`<div class="card"><h2>Agregar pendiente</h2>${taskForm()}</div><div class="card"><h2>Hoy</h2>${taskRows(state.tasks.filter(x=>x.date===today()))}</div><div class="card"><h2>Mañana</h2>${taskRows(state.tasks.filter(x=>x.date===tomorrow()))}</div><div class="card"><h2>Otros días</h2>${taskRows(state.tasks.filter(x=>x.date!==today()&&x.date!==tomorrow()).sort((a,b)=>a.date.localeCompare(b.date)))}</div>`}else if(tab==='gastos'){let allReal=state.expenses.filter(x=>!x.planned);el.innerHTML=`<div class="grid"><div class="card"><div class="muted">Gastos reales hoy</div><div class="money">${money(total(todayReal))}</div></div><div class="card"><div class="muted">Gastos reales este mes</div><div class="money">${money(total(monthReal))}</div></div></div><div class="card"><h2>Registrar gasto o planificar uno</h2>${expenseForm()}</div><div class="card"><h2>Gastos previstos</h2>${expenseRows(state.expenses.filter(x=>x.planned))}</div><div class="card"><h2>Historial de gastos reales</h2>${expenseRows(allReal)}</div>`}else if(tab==='informes'){let b=Number(state.settings.budget)||0;let categories={};monthReal.forEach(x=>categories[x.category]=(categories[x.category]||0)+Number(x.amount));let mx=Math.max(1,...Object.values(categories));let previous=new Date();previous.setDate(1);previous.setMonth(previous.getMonth()-1);let pm=previous.getFullYear()+'-'+String(previous.getMonth()+1).padStart(2,'0');let prev=total(monthExpenses(pm).filter(x=>!x.planned));el.innerHTML=`<div class="grid"><div class="card"><div class="muted">Este mes</div><div class="money">${money(total(monthReal))}</div></div><div class="card"><div class="muted">Mes anterior</div><div class="money">${money(prev)}</div></div><div class="card"><div class="muted">Presupuesto disponible</div><div class="money ${b-total(monthReal)<0?'red':'green'}">${b?money(b-total(monthReal)):'Sin definir'}</div></div><div class="card"><div class="muted">Gastos previstos para mañana</div><div class="money">${money(total(tomPlan))}</div></div></div><div class="card"><h2>¿En qué gastaste este mes?</h2>${Object.entries(categories).sort((a,b)=>b[1]-a[1]).map(([name,v])=>`<div class="chartrow"><span>${esc(name)}</span><div class="bar"><div style="width:${v/mx*100}%"></div></div><b>${money(v)}</b></div>`).join('')||'<div class="empty">Agrega gastos para ver tu distribución.</div>'}<p class="muted">Los cálculos incluyen solo gastos reales registrados manualmente. Los previstos se muestran aparte.</p></div>`}else{el.innerHTML=`<div class="card"><h2>⚙️ Personaliza MAÑANA</h2><form id="settingsForm"><div class="two"><div class="field"><label>Recordatorio matutino</label><input type="time" name="morning" value="${esc(state.settings.morning)}"></div><div class="field"><label>Recordatorio nocturno</label><input type="time" name="night" value="${esc(state.settings.night)}"></div><div class="field"><label>Presupuesto mensual</label><input type="number" name="budget" min="0" step="0.01" value="${esc(state.settings.budget)}"></div><div class="field"><label>Moneda</label><select name="currency">${[['PEN','Soles (PEN)'],['USD','Dólares (USD)'],['EUR','Euros (EUR)'],['MXN','Pesos mexicanos (MXN)'],['COP','Pesos colombianos (COP)']].map(([c,n])=>`<option value="${c}" ${state.settings.currency===c?'selected':''}>${n}</option>`).join('')}</select></div></div><p><button class="primary">Guardar ajustes</button></p></form><div class="notice">Las notificaciones del navegador son opcionales y solo pueden comprobarse mientras la app esté abierta. Para recordatorios garantizados con la app cerrada se necesita una versión Android/iOS con programación local de notificaciones.</div><p><button class="secondary" id="notifyBtn">🔔 Activar notificaciones de prueba</button> <button class="secondary" id="testNotify">Probar aviso</button></p></div><div class="card"><h2>🔒 Tus datos</h2><p class="muted">Tus pendientes y gastos se almacenan localmente en este navegador. No se envían a un servidor. Si borras los datos del navegador puedes perderlos: exporta copias regularmente.</p><div class="formrow"><button class="secondary" id="exportBtn">⬇ Exportar copia JSON</button><label class="secondary" style="cursor:pointer">⬆ Importar copia<input id="importFile" type="file" accept="application/json,.json" style="display:none"></label><button class="danger" id="wipeBtn">Borrar todos mis datos</button></div></div>`}bind()}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{let x=state.tasks.find(t=>t.id===b.dataset.check);if(x)x.done=b.checked;save();render()});document.querySelectorAll('[data-delete-task]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar este pendiente?')){state.tasks=state.tasks.filter(x=>x.id!==b.dataset.deleteTask);save();render()}});document.querySelectorAll('[data-delete-expense]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar este gasto?')){state.expenses=state.expenses.filter(x=>x.id!==b.dataset.deleteExpense);save();render()}});const tf=document.getElementById('taskForm');if(tf)tf.onsubmit=e=>{e.preventDefault();let f=new FormData(tf),title=String(f.get('title')).trim();if(!title)return;state.tasks.push({id:uid(),title,date:String(f.get('date')),time:String(f.get('time')||''),done:false});save();render()};const ef=document.getElementById('expenseForm');if(ef)ef.onsubmit=e=>{e.preventDefault();let f=new FormData(ef),amount=Number(f.get('amount')),title=String(f.get('title')).trim();if(!title||!Number.isFinite(amount)||amount<=0||amount>1e9)return alert('Ingresa un monto válido.');state.expenses.push({id:uid(),title,amount:Math.round(amount*100)/100,date:String(f.get('date')),category:String(f.get('category')),planned:f.get('planned')==='true'});save();render()};const sf=document.getElementById('settingsForm');if(sf)sf.onsubmit=e=>{e.preventDefault();let f=new FormData(sf);state.settings={...state.settings,morning:String(f.get('morning')),night:String(f.get('night')),budget:Math.max(0,Number(f.get('budget'))||0),currency:String(f.get('currency'))};save();render();alert('Ajustes guardados.')};const nb=document.getElementById('notifyBtn');if(nb)nb.onclick=async()=>{if(!('Notification'in window))return alert('Este navegador no admite notificaciones.');if(!window.isSecureContext)return alert('Publica la app con HTTPS para solicitar permisos.');let p=await Notification.requestPermission();state.settings.notifications=p==='granted';save();alert(p==='granted'?'Permiso concedido. Los avisos de esta versión funcionan solo con la aplicación abierta.':'Permiso no concedido.')};const tn=document.getElementById('testNotify');if(tn)tn.onclick=()=>{if('Notification'in window&&Notification.permission==='granted')new Notification('MAÑANA',{body:'Este es un aviso de prueba.'});else alert('Activa primero el permiso de notificaciones.')};const ex=document.getElementById('exportBtn');if(ex)ex.onclick=()=>{const blob=new Blob([JSON.stringify({version:1,...state},null,2)],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='manana-respaldo-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};const im=document.getElementById('importFile');if(im)im.onchange=async()=>{let f=im.files[0];if(!f)return;try{if(f.size>2e6)throw Error('Archivo demasiado grande');let d=JSON.parse(await f.text());if(!Array.isArray(d.tasks)||!Array.isArray(d.expenses)||!d.settings||d.tasks.length>10000||d.expenses.length>10000)throw Error('Formato de respaldo no válido');if(!confirm('Esto reemplazará tus datos actuales. ¿Continuar?'))return;state={...base(),tasks:d.tasks.filter(x=>typeof x.title==='string'&&typeof x.date==='string'&&typeof x.id==='string').map(x=>({...x,title:x.title.slice(0,140)})),expenses:d.expenses.filter(x=>typeof x.title==='string'&&typeof x.date==='string'&&Number.isFinite(Number(x.amount))&&Number(x.amount)>=0&&typeof x.id==='string').map(x=>({...x,title:x.title.slice(0,90)})),settings:{...base().settings,...d.settings},notified:{}};save();render();alert('Copia importada.')}catch(err){alert('No se pudo importar: '+err.message)}};const wipe=document.getElementById('wipeBtn');if(wipe)wipe.onclick=()=>{if(confirm('¿Borrar TODOS tus pendientes y gastos de este dispositivo? Esta acción no se puede deshacer.')){state=base();save();render()}}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});function reminders(){if(!state.settings.notifications||!('Notification'in window)||Notification.permission!=='granted'||document.visibilityState!=='visible')return;let now=new Date(),hm=now.toTimeString().slice(0,5),d=today();for(const [type,h,body] of [['morning',state.settings.morning,'Revisa lo que tienes pendiente para hoy.'],['night',state.settings.night,'Anota lo que harás y gastarás mañana.']]){let k=d+'-'+type;if(hm===h&&!state.notified[k]){new Notification('MAÑANA',{body});state.notified[k]=true;save()}}}setInterval(reminders,30000);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
